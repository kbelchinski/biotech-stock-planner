<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" role="img" aria-labelledby="t d">
  <title id="t">How every provider request is sent</title>
  <desc id="d">Each request waits for rate-limit budget, is sent with a 20s timeout, then succeeds, fails immediately, or retries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
  </defs>
  <rect width="760" height="700" rx="12" fill="#f6f8fa"/>

  <rect x="270" y="20" width="220" height="48" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="380" y="50" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0969da">Need to call a provider</text>
  <line x1="380" y1="68" x2="380" y2="92" stroke="#59636e" stroke-width="1.75" marker-end="url(#arrow)"/>

  <polygon points="380,96 500,140 380,184 260,140" fill="#fff8c5" stroke="#9a6700"/>
  <text x="380" y="136" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#9a6700">Rate-limit budget</text>
  <text x="380" y="154" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#9a6700">available?</text>

  <line x1="260" y1="140" x2="140" y2="140" stroke="#59636e" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="200" y="128" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#cf222e">No</text>
  <rect x="40" y="116" width="100" height="48" rx="8" fill="#ffebe9" stroke="#cf222e"/>
  <text x="90" y="146" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#cf222e">Wait</text>
  <path d="M 90 116 C 90 80, 380 80, 380 96" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="380" y1="184" x2="380" y2="212" stroke="#59636e" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="408" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1a7f37">Yes</text>

  <rect x="250" y="216" width="260" height="48" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="380" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0969da">Send, 20 second timeout</text>
  <line x1="380" y1="264" x2="380" y2="292" stroke="#59636e" stroke-width="1.75" marker-end="url(#arrow)"/>

  <polygon points="380,296 520,352 380,408 240,352" fill="#ffffff" stroke="#656d76"/>
  <text x="380" y="348" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2328">What came back?</text>
  <text x="380" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#656d76">HTTP response</text>

  <line x1="240" y1="352" x2="48" y2="352" stroke="#59636e" stroke-width="1.5"/>
  <line x1="48" y1="352" x2="48" y2="460" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="128" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1a7f37">2xx JSON</text>
  <rect x="20" y="464" width="160" height="56" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="100" y="498" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a7f37">Use the data</text>

  <line x1="300" y1="392" x2="220" y2="460" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="430" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#cf222e">2xx not JSON</text>
  <rect x="180" y="464" width="160" height="56" rx="8" fill="#ffebe9" stroke="#cf222e"/>
  <text x="260" y="490" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#cf222e">Invalid response</text>
  <text x="260" y="508" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#cf222e">Stop</text>

  <line x1="460" y1="392" x2="540" y2="460" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="430" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#cf222e">400 / 401 / 403 / 404</text>
  <rect x="460" y="464" width="160" height="56" rx="8" fill="#ffebe9" stroke="#cf222e"/>
  <text x="540" y="490" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#cf222e">Fail immediately</text>
  <text x="540" y="508" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#cf222e">With a hint</text>

  <line x1="520" y1="352" x2="700" y2="352" stroke="#59636e" stroke-width="1.5"/>
  <line x1="700" y1="352" x2="700" y2="460" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="340" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#9a6700">429 / 5xx / timeout</text>
  <polygon points="700,464 760,508 700,552 640,508" fill="#fff8c5" stroke="#9a6700"/>
  <text x="700" y="504" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#9a6700">Retries</text>
  <text x="700" y="520" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#9a6700">left?</text>

  <line x1="640" y1="508" x2="560" y2="580" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="580" y="560" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1a7f37">Yes, max 3</text>
  <rect x="400" y="580" width="200" height="48" rx="8" fill="#fff8c5" stroke="#9a6700"/>
  <text x="500" y="600" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#9a6700">Wait, then try again</text>
  <text x="500" y="616" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#9a6700">Retry-After or 1s, 2s, 4s</text>
  <path d="M 400 604 C 200 604, 140 200, 250 140" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="700" y1="552" x2="700" y2="620" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="718" y="590" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#cf222e">No</text>
  <rect x="620" y="624" width="120" height="48" rx="8" fill="#ffebe9" stroke="#cf222e"/>
  <text x="680" y="654" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#cf222e">Give up</text>
</svg>
